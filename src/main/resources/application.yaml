spring:
  application:
    name: DOSW-Library

  # Base de datos PostgreSQL
  datasource:
    url: jdbc:postgresql://localhost:5432/dosw_library
    username: postgres
    password: hola
    driver-class-name: org.postgresql.Driver

  # JPA / Hibernate
  jpa:
    hibernate:
      # create-drop : crea las tablas de nuevo cada que se utiliza
      # update      : crea columnas y no borrara los datos que ya se tienen
      # validate    : esta ve si las tablas existen
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

# JWT
jwt:
  # Clave secreta en Base64
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  # Tiempo de expiración del token en milisegundos (86400000 = 24 horas)
  expiration: 86400000

# Swagger / OpenAPI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

# Puerto del servidor
server:
  port: 8080

---
# Perfil de TESTS
spring:
  config:
    activate:
      on-profile: test

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false